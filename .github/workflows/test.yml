name: Unit tests

on:
  push:
    branches: [main-v2]
  pull_request:

permissions:
  contents: read

# A pull request from a branch in this repo would otherwise run twice (once for
# `push`, once for `pull_request`); the branch filter above handles that, and
# this cancels superseded runs when commits land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Run Vitest unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
