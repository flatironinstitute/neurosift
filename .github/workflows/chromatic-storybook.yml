name: Chromatic (Storybook)

on: push

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic (Storybook)
    # Dependabot-triggered runs cannot read Actions secrets, so the
    # Chromatic project token is unavailable; skip instead of failing.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Chromatic needs the full history to work out the baseline commit.
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
          onlyChanged: true
