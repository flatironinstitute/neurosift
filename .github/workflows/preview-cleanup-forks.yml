name: Preview Cleanup for Forks (GitHub Pages)

# Removes preview deploys published by preview-deploy-forks.yml. Run with
# no input to wipe every preview under previews/ on your gh-pages branch,
# or fill in `branch` to remove just that one branch's preview.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Only remove this branch's preview (leave blank to remove ALL previews)"
        required: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove preview(s)
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            SLUG=$(echo "${{ inputs.branch }}" | tr -c 'a-zA-Z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
            rm -rf "previews/$SLUG"
            git add -A
            git diff --cached --quiet || git commit -m "Remove preview for ${{ inputs.branch }}"
          else
            rm -rf previews
            git add -A
            git diff --cached --quiet || git commit -m "Remove all previews"
          fi

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin gh-pages
