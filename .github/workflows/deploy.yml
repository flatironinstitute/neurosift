name: Deploy to Cloudflare
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Update submodules
      - name: Update submodules
        run: git submodule update --init --recursive

      # The design system docs (Astro) need Node 22.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # The design system docs are served with the app, at /design-system/.
      - name: Install docs dependencies
        run: npm run docs:install

      - name: Build the design system docs into the app at /design-system/
        run: |
          npm run docs:build
          mkdir -p dist/design-system
          cp -R design-system/docs/dist/. dist/design-system/
        env:
          DOCS_BASE: /design-system/
          PUBLIC_APP_BASE: /

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name neurosift --branch main-v2 --commit-dirty=true
